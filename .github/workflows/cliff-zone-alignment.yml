name: Validar alineación automática de acantilados
on:
  push:
    paths:
      - 'editor-cliff-alignment.mjs'
      - 'editor.mjs'
      - 'editor-zones.mjs'
      - 'terrain-vertex-editor.mjs'
      - 'tests/cliff-zone-alignment.test.mjs'
      - 'tests/cliff-zone-alignment-smoke.html'
      - 'tests/browser-cliff-zone-alignment.mjs'
      - 'tests/cliff-zone-alignment-smoke.html'
      - 'tests/browser-cliff-zone-alignment.mjs'
      - '.github/workflows/cliff-zone-alignment.yml'
  pull_request:
    paths:
      - 'editor-cliff-alignment.mjs'
      - 'editor.mjs'
      - 'editor-zones.mjs'
      - 'tests/cliff-zone-alignment.test.mjs'
jobs:
  cliff-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/cliff-zone-alignment.test.mjs
      - run: node tests/sculpt-terrain-vertices.mjs
      - run: |
          node --check editor.mjs
          node --check editor-cliff-alignment.mjs
          node --check editor-zones.mjs
      - name: Start browser test server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/wildtrap-cliff-http.log 2>&1 &
          sleep 2
      - name: Browser cliff zone regression
        env:
          WILDTRAP_SMOKE_URL: http://127.0.0.1:8123/
        run: node tests/browser-cliff-zone-alignment.mjs
