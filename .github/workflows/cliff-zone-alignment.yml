name: Validar alineación automática de acantilados
on:
  push:
    paths:
      - 'editor-cliff-alignment.mjs'
      - 'editor.mjs'
      - 'editor-zones.mjs'
      - 'terrain-vertex-editor.mjs'
      - 'tests/cliff-zone-alignment.test.mjs'
      - '.github/workflows/cliff-zone-alignment.yml'
  pull_request:
    paths:
      - 'editor-cliff-alignment.mjs'
      - 'editor.mjs'
      - 'editor-zones.mjs'
      - 'tests/cliff-zone-alignment.test.mjs'
jobs:
  cliff-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/cliff-zone-alignment.test.mjs
      - run: node tests/sculpt-terrain-vertices.mjs
