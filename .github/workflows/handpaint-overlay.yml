name: Validar capa global handpaint 10K · Luz intensa
on:
  push:
    branches: [handpaint-global-hardlight-20261118, handpaint-safe-startup-v0.9.146, main]
    paths:
      - 'terrain-handpaint-overlay.mjs'
      - 'terrain-handpaint-settings.mjs'
      - 'editor.mjs'
      - 'index.html'
      - 'tests/terrain-handpaint-overlay.test.mjs'
      - 'tests/build-handpaint-preview.py'
      - 'tests/handpaint-overlay-smoke.html'
      - 'tests/browser-handpaint-overlay.mjs'
      - 'assets/terrain/texturas/terreno_handpaint_10K.png'
      - 'assets/terrain/texturas/terreno_handpaint_4K.webp'
      - '.github/workflows/handpaint-overlay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis y matemáticas Hard Light
        run: |
          node --check terrain-handpaint-overlay.mjs
          node --check editor.mjs
          node tests/terrain-handpaint-overlay.test.mjs
          node tests/explorer-shadow-cadence.test.mjs
      - name: Generar copia WebP optimizada a partir del 10K original
        run: |
          python -m pip install --quiet pillow
          python tests/build-handpaint-preview.py
      - name: Servir el proyecto con la copia optimizada
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/wt-handpaint.log 2>&1 &
          sleep 2
      - name: Verificar proyección y fusión real en Chrome
        env:
          WILDTRAP_SMOKE_URL: http://127.0.0.1:8123/
        run: node tests/browser-handpaint-overlay.mjs
      - name: Guardar la copia optimizada sin tocar la imagen 10K
        if: github.ref == 'refs/heads/handpaint-global-hardlight-20261118'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/terrain/texturas/terreno_handpaint_4K.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized 4K runtime copy of 10K handpaint artwork"
            git push origin HEAD:handpaint-global-hardlight-20261118
          fi
