name: Comprobar inicio real en navegador
on:
  push:
    branches: [main]
    paths:
      - 'tests/browser-startup.mjs'
      - '.github/workflows/browser-startup.yml'
      - 'editor.mjs'
      - 'biome-generator.mjs'
      - 'editor-biome-generator.mjs'
      - 'tests/biome-generator.mjs'
      - 'editor-player-spawns.mjs'
      - 'playtest.mjs'
      - 'tests/player-spawns.mjs'
      - 'index.html'
      - 'prefab-library.mjs'
      - 'terrain-holes.mjs'
      - 'adaptive-model-cuts.mjs'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar motor procedural de biomas
        run: node tests/biome-generator.mjs
      - name: Validar seis spawns de jugadores
        run: node tests/player-spawns.mjs
      - run: command -v google-chrome || command -v chromium
      - name: Iniciar servidor local de la revisión
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/wildtrap-http.log 2>&1 &
          sleep 2
      - name: Probar editor y modo seguro en Chrome
        env:
          WILDTRAP_SMOKE_URL: http://127.0.0.1:8123/
        run: node tests/browser-startup.mjs
