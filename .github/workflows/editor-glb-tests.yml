name: Validar editor y biblioteca GLB
on:
  push:
    branches: [main, feat/polygon-knife-v0.9.8]
    paths:
      - 'editor.mjs'
      - 'index.html'
      - 'prefab-catalog.mjs'
      - 'tests/cave-free-placement.test.mjs'
      - 'prefab-library.mjs'
      - 'prefab-gallery.mjs'
      - 'prefab-gestures.mjs'
      - 'adaptive-model-cuts.mjs'
      - 'adaptive-terrain-cuts.mjs'
      - 'terrain-holes.mjs'
      - 'assets/terrain/wildtrap-world.json'
      - 'tests/editor-glb-integration.test.mjs'
      - 'tests/prefab-gallery.test.mjs'
      - 'tests/prefab-gestures.test.mjs'
      - 'tests/adaptive-model-cuts.test.mjs'
      - 'tests/cut-stress.test.mjs'
      - 'tests/polygon-knife.test.mjs'
      - '.github/workflows/editor-glb-tests.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check editor.mjs
      - run: node --check prefab-library.mjs
      - run: node --check prefab-gallery.mjs
      - run: node --check prefab-gestures.mjs
      - run: node --check adaptive-model-cuts.mjs
      - run: node --check terrain-holes.mjs
      - run: node --check prefab-catalog.mjs
      - run: node --test tests/editor-glb-integration.test.mjs
      - run: node --test tests/prefab-gallery.test.mjs
      - run: node --test tests/prefab-gestures.test.mjs
      - run: node --test tests/adaptive-model-cuts.test.mjs
      - run: node --test tests/cut-stress.test.mjs
      - run: node --test tests/cave-free-placement.test.mjs
      - run: node --test tests/polygon-knife.test.mjs
