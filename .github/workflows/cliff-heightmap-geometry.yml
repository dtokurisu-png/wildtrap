name: Validar desplazamiento geométrico por heightmap
on:
  push:
    branches: [main]
    paths:
      - 'cliff-heightmap-geometry.mjs'
      - 'cliff-heightmap-editor.mjs'
      - 'cliff-zone-bindings.mjs'
      - 'editor-zones.mjs'
      - 'tests/cliff-zone-classification.test.mjs'
      - 'tests/cliff-heightmap-geometry.test.mjs'
      - 'tests/cliff-heightmap-real-smoke.html'
      - 'tests/browser-cliff-heightmap.mjs'
      - 'editor.mjs'
      - 'index.html'
      - 'editor-biome-generator.mjs'
      - 'editor-terrain-texture-renderer.mjs'
      - '.github/workflows/cliff-heightmap-geometry.yml'
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis geométrica e integración
        run: |
          node --check cliff-heightmap-geometry.mjs
          node --check cliff-heightmap-editor.mjs
          node --check cliff-zone-bindings.mjs
          node --check editor-zones.mjs
          node --check editor.mjs
      - name: Comprobar desplazamiento real y continuidad
        run: |
          node tests/cliff-heightmap-geometry.test.mjs
          node tests/cliff-zone-classification.test.mjs
      - name: Iniciar servidor local de la revisión
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/wildtrap-heightmap-http.log 2>&1 &
          sleep 2
      - name: Comprobar displacement con PNG real y Chrome
        env:
          WILDTRAP_SMOKE_URL: http://127.0.0.1:8123/
        run: node tests/browser-cliff-heightmap.mjs
