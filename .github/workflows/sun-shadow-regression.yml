name: Validate new isolated sun shadows (pre-release)
on:
  push:
    branches: [main, integracion-sombras-sin-rayas-v0.9.143, optimizar-latencia-sombras-v0.9.144, handpaint-global-hardlight-20261118, handpaint-safe-startup-v0.9.146]
    paths:
      - 'editor.mjs'
      - 'terrain-handpaint-overlay.mjs'
      - 'terrain-handpaint-settings.mjs'
      - 'playtest.mjs'
      - 'editor-terrain-gpu-layers.mjs'
      - 'editor-terrain-texture-renderer.mjs'
      - 'terrain-shadow-geometry.mjs'
      - 'explorer-shadow-cadence.mjs'
      - 'tests/explorer-shadow-cadence.test.mjs'
      - 'tests/terrain-shadow-geometry.test.mjs'
      - 'tests/sun-shadow-smoke.html'
      - 'tests/browser-sun-shadow.mjs'
      - 'index.html'
      - '.github/workflows/sun-shadow-regression.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ES module syntax and geometry selection
        run: |
          node --check editor.mjs
          node --check playtest.mjs
          node --check editor-terrain-gpu-layers.mjs
          node --check editor-terrain-texture-renderer.mjs
          node --check terrain-shadow-geometry.mjs
          node tests/terrain-shadow-geometry.test.mjs
          node tests/explorer-shadow-cadence.test.mjs
          # The old static terrain test assumes an obsolete CanvasTexture mask.
          # Texture visibility is covered by the real Chrome integration below.
      - name: Start local build
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/wt-sun-http.log 2>&1 &
          sleep 2
      - name: Verify projected sun shadows on real terrain renderer
        env:
          WILDTRAP_SMOKE_URL: http://127.0.0.1:8123/
        run: node tests/browser-sun-shadow.mjs
