name: Validar pincel de corte 3D
on:
  push:
    branches: [main]
    paths:
      - 'adaptive-terrain-cuts.mjs'
      - 'terrain-holes.mjs'
      - 'tests/adaptive-terrain-cuts.test.mjs'
      - '.github/workflows/terrain-cuts-tests.yml'
  workflow_dispatch:
jobs:
  adaptive-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check adaptive-terrain-cuts.mjs
      - run: node --check terrain-holes.mjs
      - run: node --check editor.mjs
      - run: node --test tests/adaptive-terrain-cuts.test.mjs
