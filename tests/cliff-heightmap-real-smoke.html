<!doctype html><html><head><meta charset="utf-8"><title>Heightmap real smoke</title></head>
<body data-result="PENDING"><div id="result">Analizando desplazamiento real</div>
<script>
const fail=(x)=>{document.body.dataset.result='FAIL';document.querySelector('#result').textContent=String(x)};
try{
 const n=129,h=Array(n*n).fill(0);
 for(let z=0;z<n;z++)for(let x=0;x<n;x++)h[z*n+x]=x<64?45:0;
 const draft={version:3,size:630,resolution:n,heights:h,nodes:[],objectGroups:[],holes:[],cuts3d:[],
  zones:[{id:'zone-main',name:'Llanura',biomeId:'plains',points:[{x:-160,z:-160},{x:160,z:-160},{x:160,z:160},{x:-160,z:160}]},
   {id:'zone-cliff',name:'Acantilado',isCliff:true,cliffParentId:'zone-main',points:[{x:-9,z:-60},{x:9,z:-60},{x:9,z:60},{x:-9,z:60}]}],
  nextId:1,settings:{heightMax:120,biomeTexturesVisible:true}};
 localStorage.setItem('wildtrap-editor-draft-safe-v1',JSON.stringify(draft));
 const frame=document.createElement('iframe');frame.src='../?safe=1&noShadows=1';frame.width=1000;frame.height=650;document.body.append(frame);
 const start=Date.now();let counted=0;
 const interval=setInterval(()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  if(!d?.querySelector('#boot[hidden]')||!w.__cliffHeightmapEditor){
   if(Date.now()-start>25000){clearInterval(interval);fail('El editor no inició: '+(d?.getElementById('bootMsg')?.textContent||'sin estado'))}
   return;
  }
  const label=d.querySelector('#cliffHeightStatus')?.textContent||'';
  if(label.includes('vértices desplazados')&&w.__cliffHeightmapEditor.getState().colorMeshes>=1&&
     w.__terrainTexturePainter?.getState?.().layers>=1&&d.querySelector('#textureTarget option[value="cliff:plains"]')){
   const count=Number(label.match(/(\d+) vértices desplazados/)?.[1]||0);
   const marked=[...d.querySelectorAll('#zoneList button')].some(b=>b.textContent.includes('⛰ ✓')&&b.title.includes('Acantilado asociado'));
   const dialog=!!d.getElementById('zoneCliffDialog');
   const images=d.querySelectorAll('#cliffBiomeCards img').length;
   const repeats=d.querySelectorAll('#textureUnifiedRepeats').length;
   const options=d.querySelectorAll('#textureTarget option').length;
   const geometryControls=!!d.getElementById('cliffHeightSmoothing')&&!!d.getElementById('cliffHeightFlatten');
   const colorMeshes=w.__cliffHeightmapEditor.getState().colorMeshes;
   const groundLayers=w.__terrainTexturePainter.getState().layers;
   const diagnostic=w.__wildtrapDiagnostics;
   const gl=diagnostic?.renderer.getContext();
   const programs=diagnostic?.renderer.info.programs||[];
   const bad=programs.filter(p=>p.program&&gl&&!gl.getProgramParameter(p.program,gl.LINK_STATUS)).map(p=>p.diagnostics?.programLog||p.cacheKey);
   const active=programs.length;
   const textureObjects=diagnostic?.scene.children.filter(obj=>obj.name.startsWith('BiomeGroundSafe')).length||0;
   const layers=diagnostic.scene.children.filter(obj=>/^(BiomeGroundSafe|CliffColor|BiomeComplement)/.test(obj.name));
   const rt=diagnostic.makeTarget(32,32);
   function samplePixels(){
    const renderer=diagnostic.renderer;
    renderer.setRenderTarget(rt);
    renderer.render(diagnostic.scene,diagnostic.getCamera());
    const out=new Uint8Array(32*32*4);
    renderer.readRenderTargetPixels(rt,0,0,32,32,out);
    renderer.setRenderTarget(null);
    return out;
   }
   let pixelDelta=-1;
   try{
    const withLayers=samplePixels();
    const previous=layers.map(l=>l.visible);
    layers.forEach(l=>l.visible=false);
    const withoutLayers=samplePixels();
    layers.forEach((l,i)=>l.visible=previous[i]);
    pixelDelta=0;
    for(let i=0;i<withLayers.length;i+=4)pixelDelta+=Math.abs(withLayers[i]-withoutLayers[i])+Math.abs(withLayers[i+1]-withoutLayers[i+1])+Math.abs(withLayers[i+2]-withoutLayers[i+2]);
   }catch(error){pixelDelta='ERROR '+(error.stack||error.message).replaceAll('<','[').replaceAll('> ','] ').replaceAll('\n',' || ').slice(0,850)}
   rt.dispose();
   clearInterval(interval);document.body.dataset.result=count>0&&marked&&dialog&&images===6&&repeats===1&&options===25&&geometryControls&&colorMeshes>0&&groundLayers>0&&textureObjects>0&&bad.length===0&&typeof pixelDelta==='number'&&pixelDelta>1000&&label.includes('zonas ⛰')?'PASS':'FAIL';
   document.querySelector('#result').textContent=label+' · marcador zona: '+marked+' · diálogo: '+dialog+' · imágenes: '+images+' · control global: '+repeats+' · selector: '+options+' · colorMeshes: '+colorMeshes+' · texturas suelo: '+groundLayers+' · WebGL programs: '+active+' · bad: '+JSON.stringify(bad)+' · ground meshes: '+textureObjects+' · pixel delta: '+pixelDelta;return;
  }
  if(Date.now()-start>30000){clearInterval(interval);fail('Sin geometría aplicada: '+label)}
 },250);
}catch(e){fail(e.stack||e)}
</script></body></html>
