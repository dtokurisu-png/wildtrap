<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cliff Top Body heightmaps - Wildtrap</title></head>
<body data-result="PENDING"><div id="result">Validando el color CUERPO.png y el heightmap CUERPO-HEIGTH.png</div>
<script>
(async()=>{
 const fail=(stage,e)=>{document.body.dataset.result='FAIL';document.getElementById('result').textContent='FAIL '+stage+': '+e.message;};
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const wait=async(fn,label)=>{
  for(let i=0;i<100;i++){const v=fn();if(v)return v;await sleep(120)}
  throw Error('Timeout '+label);
 };
 let stage='fixture';
 try{
  const n=129,key='wildtrap-editor-draft-safe-v1',heights=Array(n*n).fill(0);
  for(let z=0;z<n;z++)for(let x=0;x<n;x++){
   const h=z<=61?32:z>=65?0:32*(65-z)/4;
   heights[z*n+x]=h;
  }
  const rect=(x,z,X,Z)=>[{x,z},{x:X,z},{x:X,z:Z},{x,z:Z}];
  const cliffPoints=rect(-55,-43,55,24),plainsPoints=rect(-125,-115,125,115);
  const zone={id:'cliff1',name:'Cliff sample',isCliff:true,cliffParentId:'plain1',
   points:cliffPoints,hidden:false,cliffAlignmentSignature:'rail-v1:'+
    JSON.stringify(cliffPoints.map(p=>[p.x,p.z]))};
  // Every marked cliff must subdivide, including a zone with NO biome or
  // color material. It should render with the neutral fallback.
  const otherPoints=rect(-180,-43,-140,24);
  const otherZone={id:'cliff-unassigned',name:'Cliff without biome',isCliff:true,
   cliffParentId:null,points:otherPoints,hidden:false,
   cliffAlignmentSignature:'rail-v1:'+
    JSON.stringify(otherPoints.map(p=>[p.x,p.z]))};
  const desertPoints=rect(140,-43,185,24),desertRegion=rect(125,-115,200,115);
  const desertZone={id:'cliff-desert',isCliff:true,cliffParentId:'desert-parent',
   points:desertPoints,hidden:false,cliffAlignmentSignature:'rail-v1:'+
    JSON.stringify(desertPoints.map(p=>[p.x,p.z]))};
  // Preserve a manually edited upper rim on this same cliff zone.
  const seamIds=Array.from({length:9},(_,j)=>60*n+60+j);
  const seamAnchors=Object.fromEntries(seamIds.map(i=>[i,[
   (i%n)*630/(n-1)-315,heights[i],Math.floor(i/n)*630/(n-1)-315
  ]]));
  const manualSeam={id:'seam-upper',name:'Costura superior',kind:'cliff',
   vertices:seamIds,path:seamIds,anchors:seamAnchors};
  const project={version:3,size:630,resolution:n,heights,nodes:[],holes:[],cuts3d:[],
   objectGroups:[],nextId:1,terrainSeams:[manualSeam],terrainVertexOffsets:{},
   zones:[{id:'plain1',name:'Llanura',isCliff:false,biomeId:'plains',points:plainsPoints},
    {id:'desert-parent',name:'Desierto',isCliff:false,biomeId:'desert',points:desertRegion},
    zone,otherZone,desertZone],
   // Both historical paths are intentionally stale. The editor must
   // automatically recover them using the currently existing CUERPO.png
   // without changing the user's original 100/450 repeat scales.
   biomeMaterials:{plains:{slots:{
    cliff:{
     name:'Textura de Acantilado llanura  CUERPO.png',
     image:'./assets/terrain/texturas/'+encodeURIComponent('Textura de Acantilado llanura  CUERPO.png'),
     scale:100,opacity:1
    },
    cliffBodyColor:{
     name:'Textura de Acantilado llanura  CUERPO- COLOR.png',
     image:'./assets/terrain/texturas/'+encodeURIComponent('Textura de Acantilado llanura  CUERPO- COLOR.png'),
     scale:450,opacity:1
    },
    cliffBodyHeight:{
     // Old browser project: heightmap used the DELETED grassy filename.
     // The editor must migrate the saved URL, not merely display the PNG.
     name:'Textura de Acantilado llanura Cubierto de Hierba- HEIGTH SIN HIERBA .png',
     image:'./assets/terrain/texturas/'+encodeURIComponent('Textura de Acantilado llanura Cubierto de Hierba- HEIGTH SIN HIERBA .png'),
     scale:450,opacity:1
    }
   }}},
   settings:{heightMax:120,biomeTexturesVisible:true}};
  localStorage.setItem(key,JSON.stringify(project));
  const f=document.createElement('iframe');f.width=1400;f.height=900;f.src='../?safe=1';
  document.body.append(f);
  stage='startup';
  const painter=await wait(()=>f.contentWindow?.__terrainTexturePainter?.getPlainsCliffStats&&
   f.contentDocument?.querySelector('#boot[hidden]')&&f.contentWindow.__terrainTexturePainter,'renderer');
  const w=f.contentWindow,d=f.contentDocument;
  const generate=d.getElementById('plainsCliffGenerate'),strength=d.getElementById('plainsCliffStrength');
  assert(generate&&strength&&!generate.disabled,'Generar debe estar visible y listo');
  const version=d.getElementById('editorVersionTag');
  assert(version&&version.textContent.includes('v0.9.113'),'Versión visible inexistente o incorrecta');
  const showMaps=d.getElementById('plainsCliffViewMaps');
  assert(showMaps,'No hay acceso directo a imágenes de Llanura');
  await wait(()=>d.getElementById('textureBiome')?.options?.length>1,'biblioteca materiales');
  showMaps.click();
  const allMaps=await wait(()=>d.getElementById('plainsCliffActiveMaps')?.querySelectorAll('[data-cliff-map-slot]').length===3?
   d.getElementById('plainsCliffActiveMaps'):null,'tres materiales de CUERPO en Llanura');
  assert(d.getElementById('textureBiome').value==='plains','La selección de bioma no cambió a Llanura');
  for(const role of ['cliff','cliffBodyColor','cliffBodyHeight']){
   const row=allMaps.querySelector('[data-cliff-map-slot="'+role+'"]');
   assert(row&&new URL(row.querySelector('img')?.src||'',location.href).pathname.endsWith('.png'),'Imagen de '+role+' no visible');
   assert(row.querySelector('select')?.options.length>0,'El usuario no puede seleccionar '+role);
  }
  const mainCliff=allMaps.querySelector('[data-cliff-map-slot="cliff"]');
  assert(mainCliff&&decodeURIComponent(mainCliff.querySelector('img').getAttribute('src')).includes('Textura de Acantilado llanura CUERPO.png'),
   'La ranura de acantilado todavía contiene una ruta vieja o incorrecta');
  assert(mainCliff.querySelector('input[type="number"]').value==='100',
   'La escala 100 del acantilado original no sobrevivió a la migración');
  const initial=await wait(()=>{
   const root=painter.collisionRoot(),mesh=root.children.find(x=>x.userData.cliffZoneId==='cliff1');
   return mesh?.userData.cliffPart==='Base'?mesh:null;
  },'material base CUERPO del acantilado');
  assert(decodeURIComponent(initial.userData.cliffImage).includes('Textura de Acantilado llanura CUERPO.png'),
   'No se corrigió la textura base del acantilado con un espacio');
  assert(initial.material.map?.image?.width>0,'CUERPO.png debe estar visible en el material base');
  assert(initial.userData.repetition===100,'La escala 100 del acantilado original no se aplicó');
    assert(!allMaps.querySelector('[data-cliff-map-slot="cliffTopColor"]'),'Top Color must be absent');
  assert(!allMaps.querySelector('[data-cliff-map-slot="cliffTopHeight"]'),'Top Height must be absent');
  // Set the SAME scale the user sees in the existing texture editor. There
  // must not be an unrelated hidden Body tile size.
  const scale=allMaps.querySelector('[data-cliff-map-slot="cliffBodyColor"] input[type="number"]');
  assert(scale,'El Body Color no muestra su escala real');
  scale.value='450';scale.dispatchEvent(new Event('change',{bubbles:true}));
  stage='help-modal';
  const dialog=d.getElementById('plainsCliffHelpDialog');
  d.getElementById('plainsCliffHelp').click();
  assert(dialog.open,'La ayuda no abrió su modal');
  dialog.close();
  assert(!dialog.open,'La ayuda no cerró');
  stage='assets';
  const paths=['Textura de Acantilado llanura CUERPO.png',
   'Textura de Acantilado llanura CUERPO-HEIGTH.png'];
  for(const file of paths){
   const response=await fetch('../assets/terrain/texturas/'+encodeURIComponent(file));
   assert(response.ok,'Falta recurso '+file+' HTTP '+response.status);
  }
  for(const retired of [
   'Textura de Acantilado llanura  CUERPO.png',
   'Textura de Acantilado llanura  CUERPO- COLOR.png',
   'Textura de Acantilado llanura Cubierto de Hierba.png',
   'Textura de Acantilado llanura Cubierto de Hierba- COLOR.png',
   'Textura de Acantilado llanura Cubierto de Hierba- HEIGTH SIN HIERBA .png'
  ]){
   const reply=await fetch('../assets/terrain/texturas/'+encodeURIComponent(retired),{method:'HEAD'});
   assert(reply.status===404,'Una textura de hierba retirada sigue existiendo: '+retired);
  }
  stage='generate';
  const before=JSON.parse(localStorage.getItem(key));
  strength.value='2';strength.dispatchEvent(new Event('input',{bubbles:true}));
  generate.click();
  const stats=await wait(()=>painter.getPlainsCliffStats().zones>=1&&
    painter.getPlainsCliffStats().moved>0?painter.getPlainsCliffStats():null,'heightmaps');
  assert(stats.subdividedTriangles>stats.sourceTriangles,
   'El heightmap no produjo más triángulos solo en los sectores deformados');
  assert(stats.shapeRange>.16,'El mapa no alteró la forma del acantilado');
  assert(stats.maxOffset>0&&stats.maxOffset<8,'El desplazamiento de crestas excedió el control');
  assert(stats.heightmapZones>=1,'El PNG CUERPO-HEIGTH no se está muestreando');
  assert(stats.heightmapLoaded===true,'El PNG existe pero no fue cargado como mapa de alturas');
  assert(stats.heightmapWidth>=32&&stats.heightmapHeight>=32,
   'El mapa de alturas no se decodificó realmente');
  assert(stats.heightmapContrast>.06,
   'El mapa de alturas cargado no presenta contraste suficiente');
  assert(decodeURIComponent(stats.heightmapUrl).includes('Textura de Acantilado llanura CUERPO-HEIGTH.png'),
   'Se está intentando generar usando la ruta ANTIGUA de alturas');
  const proof=d.getElementById('plainsCliffHeightProof');
  assert(proof&&!proof.hidden&&decodeURIComponent(proof.src).includes('CUERPO-HEIGTH.png'),
   'La previsualización no muestra el archivo PNG cargado en el generador');
  const heightStatus=d.getElementById('plainsCliffStatus')?.textContent||'';
  assert(heightStatus.includes('Textura de Acantilado llanura CUERPO-HEIGTH.png'),
   'El diagnóstico no explica qué mapa se usó');
  assert(heightStatus.includes('HEIGHTMAP APLICADO'),
   'El editor no confirma que se haya aplicado el PNG de alturas');
  const root=painter.collisionRoot(),parts=root.children.filter(x=>x.userData.cliffZoneId==='cliff1');
  // A texture swap alone is insufficient. These triangles must physically
  // REPLACE base terrain triangles, not just overlap them as a decal.
  const physical=painter.getPhysicalSurfaceStats();
  assert(root.userData.isPhysicalReplacement===true,
   'El acantilado sigue siendo una capa visual; la malla real no cambió');
  assert(physical.replacedFaces>0,'No se retiraron las caras originales bajo el acantilado');
  assert(physical.remainingFaces===physical.originalFaces-physical.replacedFaces,
   'La malla principal sigue incluyendo las caras que deberían ser reemplazadas');
  assert(physical.activeFaces>=physical.replacedFaces*6,
   'La superficie física no contiene al menos seis veces más triángulos');
  assert(physical.sourceUnchanged,'Los vértices originales del escenario fueron modificados');
  assert(parts.length>=1,'No se generó ninguna malla de acantilado');
  const appliedParts=parts.filter(m=>m.userData.heightmapApplied===true);
  assert(appliedParts.length>0,'La textura cambió pero ninguna malla recibió relieve real');
  assert(appliedParts.every(m=>m.userData.cliffPart==='Body'),
   'Solo la malla deformada puede ser parte Body');
  assert(appliedParts.every(m=>m.material.depthWrite===true),
   'La malla de relieve debe tener profundidad real; no ser textura superpuesta');
  assert(appliedParts.every(m=>decodeURIComponent(m.userData.cliffImage).includes('Textura de Acantilado llanura CUERPO.png')),
   'El material generado no está usando el único archivo color CUERPO.png');
  assert(appliedParts.every(m=>m.userData.repetition===450),'La repetición visible 450 no coincide con la malla');
  assert(appliedParts.every(m=>m.userData.refinedTriangles>m.userData.sourceTriangles),
   'Una malla marcada como relieve no fue subdividida');
  assert(parts.filter(m=>!m.userData.heightmapApplied).every(m=>
   m.userData.refinedTriangles===m.userData.sourceTriangles),
   'Una zona sin relieve fue subdividida innecesariamente');
  const body=appliedParts[0];
  assert(body.material.map.wrapS===1000&&body.material.map.wrapT===1000,
   'CUERPO.png debe repetirse en X/Y como material de acantilado vertical');
  assert(body.material.map?.image?.width>0,
   'El acantilado generado debe mostrar CUERPO.png, no un material plano');
  const desertMesh=root.children.find(m=>m.userData.cliffZoneId==='cliff-desert');
  assert(desertMesh?.material.map?.image,'El acantilado actualizado de desierto no se cargó');
  assert(desertMesh.material.map.wrapS===1000&&desertMesh.material.map.wrapT===1000,
   'La textura de desierto debe repetirse en ambas dimensiones');
  const bodyUV=body.geometry.attributes.uv.array;
  const range=a=>{let min=Infinity,max=-Infinity;for(const v of a){min=Math.min(min,v);max=Math.max(max,v)}return[min,max]};
  const bodyRange=range(bodyUV);
  assert(bodyRange[1]>1.01,'Body no utiliza la repetición 450 del editor: '+bodyRange[1]);
  const inspector=w.__terrainMeshInspector;
  assert(inspector&&typeof inspector.getState==='function','El inspector de malla no funciona');
  const fallback=root.children.filter(m=>m.userData.cliffZoneId==='cliff-unassigned');
  assert(fallback.length>0,'La zona sin bioma debe conservar su superficie');
  assert(fallback.every(m=>m.userData.refinedTriangles===m.userData.sourceTriangles),
   'El acantilado sin heightmap NO debe sufrir subdivisión');
  inspector.setActive(true);
  const inspectorStats=inspector.getState();
  assert(inspectorStats.cliffTriangles===root.children.reduce((n,m)=>n+m.userData.refinedTriangles,0),
   'La vista de malla no enseña los triángulos subdivididos reales');
  inspector.setActive(false);
  const cliffStats=painter.getCliffSubdivisionStats();
  assert(cliffStats.refinedTriangles>cliffStats.sourceTriangles,
   'La malla no se refinó donde el heightmap sí aplicó geometría');
  assert(root.visible,'El grupo de acantilados no es visible');
  stage='collision';
  const script=d.createElement('script');script.type='module';
  script.textContent=`
   import * as THREE from 'three';
   import {createPlaytestCollider} from './playtest-collision.mjs?v=0.9.100';
   try{
    const cliff=window.__terrainTexturePainter.collisionRoot();
    const collider=createPlaytestCollider({THREE,terrain:cliff,roots:()=>[]});
    const count=collider.refresh();
    const wall=collider.blocked(0,15,-29,0,33,{radius:.2,height:1.7});
    const top=collider.floorAt(0,-30,32,{stepUp:5,searchDepth:8});
    window.__plainsCollisionProbe={count,wall,top:top?.y??null};
    collider.restore();
   }catch(error){window.__plainsCollisionProbe={error:error.message}}
  `;
  d.head.append(script);
  const probe=await wait(()=>w.__plainsCollisionProbe,'raycast collisions');
  assert(!probe.error,'Colisión generada falló: '+probe.error);
  assert(probe.count===root.children.length,'Las zonas subdivididas deben participar en colisiones: '+probe.count);
  assert(probe.wall===true,'El relieve del cuerpo no detuvo al personaje');
  assert(probe.top!==null,'El borde superior no tiene superficie caminable');
  stage='persist-and-seams';
  const saved=await wait(()=>{
   const r=JSON.parse(localStorage.getItem(key));
   return r?.cliffHeightmapPlains?.enabled===true?r:null;
  },'save');
  assert(saved.cliffHeightmapPlains.strength===2,'No se guardó la intensidad');
  assert(decodeURIComponent(saved.biomeMaterials.plains.slots.cliff.image).includes('Textura de Acantilado llanura CUERPO.png'),
   'El escenario guardó la ruta obsoleta del material base');
  assert(decodeURIComponent(saved.biomeMaterials.plains.slots.cliffBodyColor.image).includes('Textura de Acantilado llanura CUERPO.png'),
   'El escenario guardó la ruta obsoleta de Body Color');
  assert(saved.biomeMaterials?.plains?.slots?.cliffBodyColor?.scale===450,
   'No se guardó la repetición visible de Body Color');
  assert(saved.biomeMaterials?.plains?.slots?.cliffBodyHeight?.scale===450,
   'Body Height debe compartir escala con el color');
  assert(decodeURIComponent(saved.biomeMaterials.plains.slots.cliffBodyHeight.image)
   .includes('Textura de Acantilado llanura CUERPO-HEIGTH.png'),
   'El editor guardó de nuevo el mapa de alturas retirado');
  assert(saved.heights.every((h,i)=>h===before.heights[i]),
   'La herramienta alteró el terreno original o los vértices editados');
  assert(JSON.stringify(saved.terrainVertexOffsets)===JSON.stringify(before.terrainVertexOffsets),
   'La geometría original se desplazó');
  assert(JSON.stringify(saved.terrainSeams)===JSON.stringify(before.terrainSeams),
   'Una costura protegida cambió de posición o desapareció');
  stage='live texture refresh';
  const revisionWatcher=w.__wildtrapTextureRevisionWatcher;
  assert(revisionWatcher&&typeof revisionWatcher.refreshNow==='function',
   'No existe la actualización automática/manual de imágenes');
  const beforeRevision=revisionWatcher.getRevision();
  const beforeImage=d.querySelector('[data-cliff-map-slot="cliffBodyColor"] img')?.src;
  assert(beforeImage?.includes('wt_texture_revision='),'La miniatura no utiliza versión de PNG');
  const beforeMesh=painter.collisionRoot().children.find(m=>m.userData.cliffZoneId==='cliff1');
  d.getElementById('textureReloadImages').click();
  const updated=await wait(()=>{
   const img=d.querySelector('[data-cliff-map-slot="cliffBodyColor"] img')?.src;
   return revisionWatcher.getRevision()!==beforeRevision&&img&&img!==beforeImage?
    img:null;
  },'miniaturas con PNG nuevos');
  assert(updated.includes('wt_texture_revision=manual-'),
   'El botón no fuerza URL de una versión de la imagen');
  const replacement=await wait(()=>{
   const next=painter.collisionRoot().children.find(m=>m.userData.cliffZoneId==='cliff1');
   return next&&next!==beforeMesh?next:null;
  },'geometría y materiales regenerados con nuevos PNG');
  assert(replacement.material.map?.image?.src?.includes('wt_texture_revision=manual-'),
   'La GPU no refrescó CUERPO.png en el acantilado');
  const desertUpdated=await wait(()=>{
   const next=painter.collisionRoot().children.find(m=>m.userData.cliffZoneId==='cliff-desert');
   return next&&next!==desertMesh?next:null;
  },'material de desierto actualizado');
  assert(desertUpdated.material.map.image?.src?.includes('wt_texture_revision=manual-'),
   'La GPU conserva la versión antigua de la textura de desierto');
  const afterRefresh=JSON.parse(localStorage.getItem(key));
  assert(JSON.stringify(afterRefresh.heights)===JSON.stringify(saved.heights),
   'Actualizar imágenes alteró la malla del terreno');
  assert(JSON.stringify(afterRefresh.terrainSeams)===JSON.stringify(saved.terrainSeams),
   'Actualizar imágenes alteró las costuras');
  assert(JSON.stringify(afterRefresh.biomeMaterials)===JSON.stringify(saved.biomeMaterials),
   'Actualizar imágenes cambió las texturas guardadas');
  document.body.dataset.result='PASS';
  document.getElementById('result').textContent='PASS · v0.9.113 heightmap CUERPO-HEIGTH recuperado de nombre antiguo; PNG real decodificado; perímetro global protegido; relieve visible';
 }catch(e){fail(stage,e)}
})();
</script></body></html>
