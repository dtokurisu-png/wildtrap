<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101d19"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/wildtrap-192.png">
<title>WildTrap · Explorar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d19;color:white;font-family:system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:absolute;inset:0;z-index:20;background:#10251fe8;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:15px}
#loading[hidden]{display:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:8}
#spawnButton{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;min-width:90px;min-height:46px;border:1px solid #85dbc4;border-radius:12px;background:#184b3fdd;color:white;font-size:14px;font-weight:700;pointer-events:auto}
#joystick{position:absolute;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:142px;height:142px;border-radius:50%;background:#153d34a8;border:2px solid #a9ffe17a;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:46px;top:46px;width:46px;height:46px;border-radius:50%;background:#00bfaabf;box-shadow:0 0 0 3px #aaf8de73;pointer-events:none}
#help{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 12px);font-size:11px;opacity:.7;max-width:45vw}
#mapOverlay{position:absolute;inset:0;background:#081b19d9;display:flex;justify-content:center;align-items:center;padding:18px;z-index:15;pointer-events:auto}
#mapOverlay[hidden]{display:none}
#mapPanel{width:min(95vw,460px);max-height:94dvh;overflow:auto;background:#19382e;border:1px solid #63bba2;border-radius:15px;padding:13px}
#mapPanel h2{font-size:16px;margin:0 0 5px}
#mapPanel p{font-size:12px;margin:3px 0 10px;color:#c8e8dc}
#map{width:min(100%,65dvh);aspect-ratio:1;display:block;margin:0 auto;touch-action:none;background:#1b302b;border:1px solid #669b89;border-radius:9px}
#coords{font-size:12px;padding:7px 1px;color:#cef0e4}
.actions{display:flex;gap:8px}.actions button{flex:1;min-height:43px;background:#295748;color:white;border:1px solid #8ed1b8;border-radius:9px;font-size:14px}
#accept{background:#007d67;border-color:#80f6d7;font-weight:700}
#landscapeButton,#installButton{position:absolute;top:calc(env(safe-area-inset-top) + 12px);height:46px;border:1px solid #85dbc4;border-radius:12px;background:#184b3fdd;color:#fff;padding:0 8px;font-size:12px;font-weight:700;pointer-events:auto}
#landscapeButton{right:119px}#installButton{right:222px;background:#007d67}
#updateBanner{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 67px);transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:7px;max-width:92vw;padding:8px;background:#15372f;border:1px solid #7de5c5;border-radius:11px;font-size:12px}
#updateBanner[hidden],#installButton[hidden],#installHint[hidden]{display:none}
#updateBanner button,#installHint button{background:#007d67;border:1px solid #89f7d9;color:white;border-radius:8px;padding:8px;font-size:12px;font-weight:700}
#installHint{position:absolute;right:12px;bottom:10px;max-width:min(365px,94vw);background:#163c31;color:white;border:1px solid #66c1a3;border-radius:10px;padding:10px;z-index:18;font-size:12px;pointer-events:auto}
@media(max-width:650px){#landscapeButton{right:110px;padding:0 5px}#installButton{right:199px;padding:0 5px}#spawnButton{min-width:80px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<canvas id="world"></canvas>
<div id="loading">Cargando escenario WildTrap…</div>
<div id="hud">
 <div id="help">WILDTRAP · exploración móvil</div>
 <button id="installButton" type="button" hidden>Instalar</button><button id="landscapeButton" type="button">⛶ Horizontal</button><button id="spawnButton" type="button">⌖ Jugador 1</button>
 <div id="joystick" role="group" aria-label="Joystick para caminar"><div id="knob"></div></div>
</div>
<div id="updateBanner" hidden role="status"><span>Nueva versión de WildTrap</span><button id="updateNow" type="button">Actualizar</button><button id="updateLater" type="button">Después</button></div>
<div id="installHint" hidden role="status"><span id="installHintText"></span> <button id="installHintClose" type="button">Cerrar</button></div>
<div id="mapOverlay" hidden><div id="mapPanel">
 <h2>⌖ Colocar spawn · Jugador 1</h2><p>Vista cenital (eje Y). Toca un lugar del escenario y pulsa Aceptar.</p>
 <canvas id="map" width="630" height="630" aria-label="Mapa cenital para elegir una posición"></canvas>
 <div id="coords">Selecciona un punto del mapa</div>
 <div class="actions"><button id="cancel" type="button">Cancelar</button><button id="accept" type="button">Aceptar</button></div>
</div></div>
<button id="test" hidden></button><span id="testModelStatus" hidden></span><span id="testCoords" hidden></span><span id="toast" hidden></span>
<script type="module" src="./mobile.mjs?v=0.9.176"></script><script type="module" src="./mobile-install.mjs?v=0.9.176"></script>
</body></html>
